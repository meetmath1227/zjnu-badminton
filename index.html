  <script>(() => {
  'use strict';
  const FORMAT = 'yumaoqiu-encrypted-v1';
  const ITERATIONS = 600000;
  const encoder = new TextEncoder();
  const extra = encoder.encode(FORMAT);
  const fromBase64 = text => Uint8Array.from(atob(text), ch => ch.charCodeAt(0));
  function toBase64(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    return btoa(binary);

    return payload;
  }
  async function derive(password, salt, usage) {
    const material = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, usage);

    validate(payload);
    const key = await derive(password, fromBase64(payload.salt), ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(payload.iv), additionalData: extra, tagLength: 128 }, key, fromBase64(payload.ciphertext));
    return new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
  }
  async function encrypt(html, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await derive(password, salt, ['encrypt']);
    const bytes = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: extra, tagLength: 128 }, key, encoder.encode(html));
    return { format: FORMAT, iterations: ITERATIONS, salt: toBase64(salt), iv: toBase64(iv), ciphertext: toBase64(new Uint8Array(bytes)) };
  }
  window.YumaoqiuAccess = { validate, decrypt, encrypt };
})();

(() => {
  'use strict';
  const form = document.getElementById('unlockForm'), input = document.getElementById('accessPassword');
  const status = document.getElementById('accessStatus'), button = document.getElementById('unlock'), show = document.getElementById('showPassword');
  let busy = false;
  show.addEventListener('click', () => {
    const visible = input.type === 'password'; input.type = visible ? 'text' : 'password';
    show.textContent = visible ? '隐藏' : '显示'; show.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码'); show.setAttribute('aria-pressed', String(visible));
  });
  form.addEventListener('submit', async event => {
    event.preventDefault(); if (busy) return;
    if (!input.value) { input.focus(); return; }
    if (!crypto.subtle) { status.textContent = '浏览器不支持本地解密，请使用更新后的浏览器，从 HTTPS 网页地址打开。'; status.classList.add('error'); return; }
    busy = true; button.disabled = true; input.disabled = true; show.disabled = true;
    status.classList.remove('error'); status.textContent = '正在解锁…'; button.textContent = '正在解锁…';
    try {
      const payload = JSON.parse(document.getElementById('encryptedApp').textContent);
      const html = await window.YumaoqiuAccess.decrypt(payload, input.value);
      input.value = ''; delete window.YumaoqiuAccess;
      document.open(); document.write(html); document.close();
    } catch {
      status.textContent = '密码不正确，或页面文件已损坏，请检查后重试。'; status.classList.add('error');
      input.disabled = false; show.disabled = false; button.disabled = false; button.textContent = '解锁进入';
      input.value = ''; input.type = 'password'; show.textContent = '显示'; show.setAttribute('aria-pressed', 'false'); show.setAttribute('aria-label', '显示密码');
      busy = false; input.focus();
    }
  });
})();
